<!doctype html><html lang="zh"><meta charset="utf-8"><title>一间好自习 · 本地GLB查看</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><script type="importmap">{"imports":{"three":"/local/three.js"}}</script><style>body{margin:0;background:#edf1ed;font:16px system-ui;color:#183a3a}header{padding:16px;background:white}canvas{width:100%;height:75vh;touch-action:none}button,input{margin:8px}#status{font-size:13px}</style><header><b>一间好自习 · 模拟场景 · GLB离线查看器</b><br><input id="file" type="file" accept=".glb"><label><input id="walls" type="checkbox">显示墙体</label><label><input id="labels" type="checkbox" checked>编号</label><span>拖动旋转，滚轮缩放；米制。本地 Three.js WebGL 深度测试，不代替官方/几何验收。</span><div id="status">请选择导出的 scene.glb；默认隐藏墙体方便观察家具。</div></header><canvas id="canvas"></canvas><script type="application/json" id="legacy-viewer-source">
const c=document.querySelector('#canvas'),ctx=c.getContext('2d');let triangles=[],nodes=[],yaw=.65,pitch=.65,zoom=65,center=[3,0,2.5],drag;
const colors=['#b7c1b8','#d6d7cb','#8b512c','#607889','#c79554','#267b80'];
function project(v){let [x,y,z]=v.map((a,k)=>a-center[k]);const xx=x*Math.cos(yaw)-z*Math.sin(yaw),zz=x*Math.sin(yaw)+z*Math.cos(yaw);return [c.width/2+xx*zoom,c.height/2+(zz*Math.sin(pitch)-y*Math.cos(pitch))*zoom,zz*Math.cos(pitch)+y*Math.sin(pitch)];}
function draw(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.fillStyle='#edf1ed';ctx.fillRect(0,0,c.width,c.height);const walls=document.querySelector('#walls').checked;const tt=triangles.filter(t=>walls||t.kind!=='wall').map(t=>({...t,p:t.v.map(project)})).sort((a,b)=>a.p.reduce((s,v)=>s+v[2],0)-b.p.reduce((s,v)=>s+v[2],0));for(const t of tt){ctx.beginPath();t.p.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=t.color;ctx.fill();ctx.strokeStyle='#233b3b55';ctx.stroke();}if(document.querySelector('#labels').checked){ctx.fillStyle='#102e35';ctx.font=`${12*devicePixelRatio}px sans-serif`;for(const n of nodes.filter(n=>n.name.endsWith(':top')||n.kind==='cabinet'||n.kind==='door')){const p=project(n.center);ctx.fillText(n.name,p[0],p[1]-8);}}}
file.onchange=async()=>{try{const b=await file.files[0].arrayBuffer(),v=new DataView(b);if(v.getUint32(0,true)!==0x46546c67||v.getUint32(4,true)!==2||v.getUint32(8,true)!==b.byteLength)throw Error('无效GLB');const len=v.getUint32(12,true),j=JSON.parse(new TextDecoder().decode(new Uint8Array(b,20,len))),base=28+len;const acc=i=>{const a=j.accessors[i],bv=j.bufferViews[a.bufferView],dim=a.type==='VEC3'?3:1,sz=a.componentType===5126?4:2;return Array.from({length:a.count},(_,k)=>Array.from({length:dim},(_,q)=>{const o=base+(bv.byteOffset||0)+(a.byteOffset||0)+k*(bv.byteStride||dim*sz)+q*sz;return sz===4?v.getFloat32(o,true):v.getUint16(o,true);}));};triangles=[];nodes=[];for(const ni of j.scenes[j.scene||0].nodes){const n=j.nodes[ni];if(n.rotation||n.matrix||n.children)throw Error('此查看器仅支持本项目扁平TRS子集');const p=j.meshes[n.mesh].primitives[0],verts=acc(p.attributes.POSITION).map(v=>v.map((a,k)=>a*n.scale[k]+n.translation[k])),ii=acc(p.indices).flat();nodes.push({name:n.name,center:n.translation,kind:n.extras.kind});for(let k=0;k<ii.length;k+=3)triangles.push({v:ii.slice(k,k+3).map(i=>verts[i]),kind:n.extras.kind,color:colors[p.material]||'#aaa'});}const floor=j.nodes.find(n=>n.name==='room:floor');center=[floor.translation[0],.6,floor.translation[2]];zoom=Math.min(c.clientWidth/floor.scale[0],c.clientHeight/floor.scale[2])*.65*devicePixelRatio;document.querySelector('#status').textContent=`已从GLB二进制读取 ${nodes.length} 个部件 / ${triangles.length} 个三角形 · 单位m · ${file.files[0].name}`;draw();}catch(e){document.querySelector('#status').textContent='读取失败：'+e.message;}};
const jid=new URLSearchParams(location.search).get('job');if(jid){fetch(`/api/jobs/${jid}/assets/scene.glb`).then(r=>r.arrayBuffer()).then(b=>{const f=new File([b],'scene.glb',{type:'model/gltf-binary'});Object.defineProperty(file,'files',{value:[f]});return file.onchange()}).catch(e=>status.textContent='自动载入失败：'+e.message);}c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);};c.onpointerup=()=>drag=null;c.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(.1,Math.min(1.5,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw();};c.onwheel=e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);draw();};document.querySelector('#walls').onchange=draw;document.querySelector('#labels').onchange=draw;window.onresize=draw;draw();
</script><script type="module" src="/local/viewer-webgl.js"></script></html>
